<svg
  xmlns="http://www.w3.org/2000/svg"
  width="720"
  height="560"
  viewBox="0 0 720 560"
  role="img"
  aria-labelledby="day-title day-desc"
>
  <title id="day-title">日影怎样留下时间读数</title>
  <desc id="day-desc">
    原理示意：阳光从左上方照向立杆，立杆在晷面右侧投下影子。太阳所见位置变化，影子也随之移动，可以与设计好的刻线对照。图中不标真实时刻，也不复原某件日晷。
  </desc>
  <style>
    text {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
      fill: #303e36;
    }
    .label {
      font-size: 23px;
    }
    .small {
      font-size: 18px;
      fill: #58675b;
    }
    .leader {
      fill: none;
      stroke: #778373;
      stroke-width: 2;
    }
  </style>
  <defs>
    <marker
      id="light-arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto"
    >
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ac7a29" />
    </marker>
  </defs>
  <rect width="720" height="560" rx="12" fill="#faf8f0" data-graph-role="background" />
  <text x="36" y="48" font-size="29" font-weight="600">日影怎样留下时间读数</text>
  <text x="36" y="86" font-size="21" fill="#58675b">太阳所见位置改变，影子随之移动。</text>
  <g id="sun" data-graph-role="decoration">
    <circle cx="150" cy="146" r="25" fill="#efcf85" stroke="#ac7a29" stroke-width="2.5" />
    <path
      d="M150 109V100 M150 183V192 M113 146H104 M187 146H196 M124 120L117 113 M176 172L183 179 M124 172L117 179 M176 120L183 113"
      stroke="#ac7a29"
      stroke-width="2.5"
      stroke-linecap="round"
    />
  </g>
  <text x="98" y="224" class="label">太阳</text>
  <ellipse cx="350" cy="398" rx="285" ry="60" fill="#edf0e5" stroke="#9aa88b" stroke-width="2.5" />
  <g id="dial-marks" data-graph-role="decoration" stroke="#9aa88b" stroke-width="2">
    <path
      d="M83 398H108 M117 428L140 421 M209 451L219 438 M350 458V442 M490 451L480 438 M583 428L560 421 M618 398H594"
    />
  </g>
  <path d="M350 398H592" fill="none" stroke="#465f48" stroke-width="14" stroke-linecap="round" />
  <path
    d="M176 162L592 398"
    fill="none"
    stroke="#bf9343"
    stroke-width="2.5"
    stroke-dasharray="8 7"
  />
  <path
    d="M218 186L296 230"
    fill="none"
    stroke="#ac7a29"
    stroke-width="3"
    marker-end="url(#light-arrow)"
  />
  <text x="300" y="170" class="label" fill="#8d611c">光照方向</text>
  <path d="M350 261V398" stroke="#66553c" stroke-width="10" stroke-linecap="round" />
  <circle cx="350" cy="398" r="8" fill="#66553c" />
  <text x="419" y="251" class="label">立杆</text>
  <path d="M402 248L359 263" class="leader" />
  <text x="96" y="298" class="label">晷面</text>
  <path d="M152 307L212 347" class="leader" />
  <text x="481" y="476" class="label">影子</text>
  <path d="M497 448V408" class="leader" />
  <text x="103" y="476" class="label">刻线</text>
  <path d="M148 449L151 424" class="leader" />
  <text x="36" y="520" class="small">原理示意：刻线须配合晷针、晷面及观测地点设计。</text>
  <text x="36" y="546" class="small">不表示某件古代日晷的形制、比例或真实时刻。</text>
</svg>
