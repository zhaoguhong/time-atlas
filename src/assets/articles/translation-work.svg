<svg
  xmlns="http://www.w3.org/2000/svg"
  width="800"
  height="650"
  viewBox="0 0 800 650"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">经书抵达以后，还要做什么</title>
  <desc id="desc">
    理解原文、讨论概念、形成译文、校订与讲授是相互连接的工作，讨论与校订可反复进行。
  </desc>
  <style>
    text {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      fill: #303e36;
    }
    .title {
      font-size: 30px;
      font-weight: 600;
    }
    .label {
      font-size: 24px;
      font-weight: 600;
    }
    .small {
      font-size: 20px;
      fill: #5a685d;
    }
    .arrow {
      fill: none;
      stroke: #8b795b;
      stroke-width: 3;
      marker-end: url(#arrow);
    }
    .box {
      fill: #edf0e5;
      stroke: #9aa88b;
      stroke-width: 2;
    }
  </style>
  <defs>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="7"
      markerHeight="7"
      orient="auto"
    >
      <path d="M0 0L10 5L0 10Z" fill="#8b795b" />
    </marker>
  </defs>
  <rect width="800" height="650" rx="16" fill="#faf8f0" />
  <text x="40" y="58" class="title">经书抵达以后，还要做什么</text>
  <text x="40" y="98" class="small">语言转换、文本校订与教学，让旅途所得继续传播。</text>
  <rect x="55" y="150" width="290" height="110" rx="12" class="box" />
  <text x="85" y="195" class="label">理解原文</text>
  <text x="85" y="231" class="small">语言、义理与不同文本</text>
  <rect x="455" y="150" width="290" height="110" rx="12" class="box" />
  <text x="485" y="195" class="label">讨论与选择表达</text>
  <text x="485" y="231" class="small">解释概念，比较汉语用词</text>
  <path d="M345 205H445" class="arrow" />
  <path d="M600 260V355" class="arrow" />
  <rect x="455" y="365" width="290" height="110" rx="12" class="box" />
  <text x="485" y="410" class="label">形成译文与校订</text>
  <text x="485" y="446" class="small">记录、核对与修改</text>
  <rect x="55" y="365" width="290" height="110" rx="12" class="box" />
  <text x="85" y="410" class="label">抄传、讲授与实践</text>
  <text x="85" y="446" class="small">让更多人阅读和学习</text>
  <path d="M455 420H355" class="arrow" />
  <path d="M745 405Q790 290 750 205" class="arrow" />
  <rect x="55" y="530" width="690" height="62" rx="10" fill="#eee4d1" />
  <text x="86" y="570" class="small">这些工作常需往返讨论，人员与分工因译场而异。</text>
  <text x="40" y="628" font-size="17">工作关系示意 · 不对应固定官职，也不表示唯一译经程序</text>
</svg>
