<svg xmlns="http://www.w3.org/2000/svg" width="600" height="488" viewBox="0 0 600 488" role="img" aria-labelledby="title desc">
<title id="title">胶济铁路交给了谁</title>
<desc id="desc">1919年对德和约将德国原有胶济铁路及附属财产权益交给日本，中国代表没有签署。1922年中日另议移交，中国以有偿方式接收铁路。</desc>
<rect x="0" y="0" width="600" height="488" rx="0" fill="#fbf7ee"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="36" y="58" font-size="34" fill="#273c37" text-anchor="start" font-weight="650">胶济铁路交给了谁</text>
<path d="M36 79H564" fill="none" stroke="#bfbda8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="138" font-size="28" fill="#1b6055" text-anchor="start" font-weight="650">1919年 · 巴黎</text>
<rect x="36" y="160" width="160" height="73" rx="12" fill="#e6e9dc"/>
<rect x="404" y="160" width="160" height="73" rx="12" fill="#e6e9dc"/>
<text x="116" y="207" font-size="31" fill="#273c37" text-anchor="middle" font-weight="650">德国</text>
<text x="484" y="207" font-size="31" fill="#273c37" text-anchor="middle" font-weight="650">日本</text>
<path d="M210 194h176m-11 -8 11 8 -11 8" fill="none" stroke="#1b6055" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="272" font-size="25" fill="#273c37" text-anchor="start" font-weight="400">对德和约把原有铁路权益转给日本。</text>
<path d="M36 297H564" fill="none" stroke="#bfbda8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="344" font-size="28" fill="#99462f" text-anchor="start" font-weight="650">1922年 · 中日交涉</text>
<rect x="36" y="364" width="160" height="65" rx="12" fill="#efe3d4"/>
<rect x="404" y="364" width="160" height="65" rx="12" fill="#efe3d4"/>
<text x="116" y="406" font-size="31" fill="#273c37" text-anchor="middle" font-weight="650">日本</text>
<text x="484" y="406" font-size="31" fill="#273c37" text-anchor="middle" font-weight="650">中国</text>
<path d="M210 395h176m-11 -8 11 8 -11 8" fill="none" stroke="#99462f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="36" y="465" font-size="25" fill="#273c37" text-anchor="start" font-weight="400">另订条约，议定铁路价款与接收条件。</text>
</g>
</svg>
